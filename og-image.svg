<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1A24"/>
      <stop offset="45%" stop-color="#5B0810"/>
      <stop offset="100%" stop-color="#240306"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="ogGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D0"/>
      <stop offset="35%" stop-color="#F2CE5E"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E730B"/>
    </linearGradient>
    
    <linearGradient id="flameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#D83010"/>
      <stop offset="35%" stop-color="#FF7A00"/>
      <stop offset="75%" stop-color="#FFDD00"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EB86C"/>
      <stop offset="100%" stop-color="#1B632E"/>
    </linearGradient>

    <!-- Kasavu Border Pattern -->
    <pattern id="kasavuStripe" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#D4AF37" stroke-width="8" opacity="0.3"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="#F2CE5E" stroke-width="4" opacity="0.2"/>
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD00" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#701018" stop-opacity="0"/>
    </radialGradient>

    <filter id="ogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBgGrad)"/>

  <!-- Kasavu Golden Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="url(#ogGoldGrad)" stroke-width="3"/>
  <rect x="36" y="36" width="1128" height="558" rx="10" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- Corner Kasavu Accents -->
  <circle cx="48" cy="48" r="8" fill="url(#ogGoldGrad)"/>
  <circle cx="1152" cy="48" r="8" fill="url(#ogGoldGrad)"/>
  <circle cx="48" cy="582" r="8" fill="url(#ogGoldGrad)"/>
  <circle cx="1152" cy="582" r="8" fill="url(#ogGoldGrad)"/>

  <!-- Ambient Glow Behind Mandala -->
  <circle cx="910" cy="315" r="280" fill="url(#lampGlow)"/>

  <!-- Left Side Content -->
  <g transform="translate(80, 0)">
    <!-- Festive Badge -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="rgba(212, 175, 55, 0.15)" stroke="url(#ogGoldGrad)" stroke-width="1.5"/>
      <text x="110" y="27" fill="#F7E7A9" font-family="'Cinzel', 'Segoe UI', serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="3">KERALA TRIBUTE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="210" fill="#FFF5D0" font-family="'Cinzel', Georgia, serif" font-size="56" font-weight="900" letter-spacing="1">
      ONAM TRIBUTE
    </text>

    <!-- Malayalam Script Subhead -->
    <text x="0" y="265" fill="#E5C558" font-family="'Gayathri', sans-serif" font-size="32" font-weight="700">
      പൊന്നോണം — ഐശ്വര്യത്തിന്റെയും സമൃദ്ധിയുടെയും ഉത്സവം
    </text>

    <!-- Divider Line -->
    <line x1="0" y1="295" x2="520" y2="295" stroke="url(#ogGoldGrad)" stroke-width="2"/>
    <polygon points="260,290 265,295 260,300 255,295" fill="#FFF5D0"/>

    <!-- Description -->
    <text x="0" y="345" fill="#E5DDD0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="400">
      <tspan x="0" dy="0">Celebrating the timeless spirit of King Mahabali,</tspan>
      <tspan x="0" dy="32">sacred floral carpets, traditional boat races,</tspan>
      <tspan x="0" dy="32">and the grand 26-dish Onasadya harvest feast.</tspan>
    </text>

    <!-- Highlights Badges -->
    <g transform="translate(0, 475)">
      <!-- Badge 1: Athapookkalam -->
      <rect x="0" y="0" width="136" height="38" rx="8" fill="#144922" stroke="#2E8B47" stroke-width="1.2"/>
      <text x="68" y="24" fill="#A3F0B5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🌸 Pookkalam</text>

      <!-- Badge 2: Onasadya -->
      <rect x="148" y="0" width="124" height="38" rx="8" fill="#144922" stroke="#2E8B47" stroke-width="1.2"/>
      <text x="210" y="24" fill="#A3F0B5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🍛 Onasadya</text>

      <!-- Badge 3: Vallam Kali -->
      <rect x="284" y="0" width="138" height="38" rx="8" fill="#144922" stroke="#2E8B47" stroke-width="1.2"/>
      <text x="353" y="24" fill="#A3F0B5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🚣 Vallam Kali</text>

      <!-- Badge 4: Pulikali -->
      <rect x="434" y="0" width="120" height="38" rx="8" fill="#144922" stroke="#2E8B47" stroke-width="1.2"/>
      <text x="494" y="24" fill="#A3F0B5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🐯 Pulikali</text>
    </g>
  </g>

  <!-- Right Side: Majestic Pookkalam Mandala & Diya Artwork -->
  <g transform="translate(910, 315)" filter="url(#ogShadow)">
    <!-- Outer Golden Multi-ring Mandala -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="url(#ogGoldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="188" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
    <circle cx="0" cy="0" r="172" fill="#5B0810" stroke="url(#ogGoldGrad)" stroke-width="2"/>

    <!-- 16 Outer Floral Petals -->
    <g>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#ogGoldGrad)" transform="rotate(0)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#leafGrad)" transform="rotate(22.5)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#ogGoldGrad)" transform="rotate(45)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#leafGrad)" transform="rotate(67.5)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#ogGoldGrad)" transform="rotate(90)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#leafGrad)" transform="rotate(112.5)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#ogGoldGrad)" transform="rotate(135)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#leafGrad)" transform="rotate(157.5)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#ogGoldGrad)" transform="rotate(180)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#leafGrad)" transform="rotate(202.5)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#ogGoldGrad)" transform="rotate(225)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#leafGrad)" transform="rotate(247.5)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#ogGoldGrad)" transform="rotate(270)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#leafGrad)" transform="rotate(292.5)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#ogGoldGrad)" transform="rotate(315)"/>
      <path d="M0 -170 C16 -135 16 -95 0 -65 C-16 -95 -16 -135 0 -170 Z" fill="url(#leafGrad)" transform="rotate(337.5)"/>
    </g>

    <!-- Inner Circle Layer -->
    <circle cx="0" cy="0" r="105" fill="#3B050B" stroke="url(#ogGoldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#ECC856" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Central Traditional Nilavilakku Diya Base -->
    <ellipse cx="0" cy="32" rx="55" ry="22" fill="url(#ogGoldGrad)" stroke="#FFF5D0" stroke-width="1.5"/>
    <ellipse cx="0" cy="27" rx="44" ry="14" fill="#5B0810"/>
    <ellipse cx="0" cy="24" rx="38" ry="10" fill="url(#flameGrad)" opacity="0.85"/>
    
    <!-- Central Grand Sacred Flame -->
    <path d="M0 -75 C18 -45 28 -18 22 10 C14 28 -14 28 -22 10 C-28 -18 -18 -45 0 -75 Z" fill="url(#flameGrad)"/>
    <!-- Inner Flame Core -->
    <path d="M0 -55 C10 -32 15 -10 10 7 C5 18 -5 18 -10 7 C-15 -10 -10 -32 0 -55 Z" fill="#FFFFFF"/>

    <!-- Sparkling Embers -->
    <circle cx="0" cy="-90" r="4.5" fill="#FFF5D0"/>
    <circle cx="-38" cy="-25" r="3" fill="#FFDF00"/>
    <circle cx="38" cy="-25" r="3" fill="#FFDF00"/>
    <circle cx="-25" cy="-60" r="2.5" fill="#FFEAA0"/>
    <circle cx="25" cy="-60" r="2.5" fill="#FFEAA0"/>
  </g>
</svg>
